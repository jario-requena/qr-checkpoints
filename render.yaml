services:
  - type: web
    name: qr-checkpoints
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: AUTH_USER
        sync: false
      - key: AUTH_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: MisQR <no-reply@misqr.online>
      - key: ADMIN_EMAIL
        sync: false
      - key: APP_URL
        value: https://misqr.online
