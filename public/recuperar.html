<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña · MisQR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/theme.js"></script>
<style>.material-symbols-outlined{ font-size:inherit; line-height:1; }</style>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col">
<div class="fixed inset-0 pointer-events-none opacity-40 bg-[radial-gradient(#8c716e_0.75px,transparent_0.75px)] [background-size:24px_24px]"></div>

<header class="relative z-10 h-20 px-margin-sm sm:px-margin flex items-center">
  <a href="/" class="flex items-center gap-space-sm">
    <span class="material-symbols-outlined text-primary text-[28px]">qr_code_2</span>
    <span class="font-headline-sm text-headline-sm text-primary uppercase">MisQR</span>
  </a>
</header>

<main class="relative z-10 flex-1 flex items-center justify-center px-margin-sm py-space-xl">
  <div class="w-full max-w-lg bg-surface-container p-space-lg rounded-xl shadow-lg relative overflow-hidden">
    <div class="absolute inset-0 pointer-events-none opacity-20 bg-[radial-gradient(#8c716e_0.5px,transparent_0.5px)] [background-size:16px_16px]"></div>
    <div class="relative z-10">
      <div class="text-center mb-space-md">
        <span class="font-label-sm text-label-sm text-primary uppercase tracking-widest font-bold">Generador QR · Bitácora de control</span>
        <h1 class="font-headline-md text-headline-md text-on-surface mt-1 mb-space-xs">Recuperar contraseña</h1>
        <p class="font-body-sm text-body-sm text-secondary" id="intro">Escribe tu usuario o correo y te enviaremos un código de 6 dígitos.</p>
      </div>

      <!-- Paso 1: pedir código -->
      <form class="space-y-space-md" id="step1">
        <div>
          <label for="identifier" class="block font-label-sm text-label-sm uppercase text-on-surface mb-1">Usuario o correo</label>
          <input id="identifier" class="w-full h-11 px-space-md bg-surface font-body-md text-body-md text-on-surface rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container transition-all" required autofocus type="text" autocomplete="username" autocapitalize="none" placeholder="tu.usuario o tu@correo.com">
        </div>
        <button class="w-full h-12 bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md uppercase rounded-lg shadow-sm transition-all hover:shadow-md flex items-center justify-center gap-space-xs font-bold disabled:opacity-50" type="submit">
          <span>Enviar código</span>
          <span class="material-symbols-outlined text-[18px]">mail</span>
        </button>
      </form>

      <!-- Paso 2: código + nueva contraseña -->
      <form class="space-y-space-md hidden" id="step2">
        <div>
          <label for="code" class="block font-label-sm text-label-sm uppercase text-on-surface mb-1">Código de 6 dígitos</label>
          <input id="code" class="w-full h-14 px-space-md bg-surface font-mono-data text-[26px] tracking-[0.5em] text-center text-on-surface rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container transition-all" required type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000">
        </div>
        <div>
          <label for="password" class="block font-label-sm text-label-sm uppercase text-on-surface mb-1">Nueva contraseña</label>
          <input id="password" class="w-full h-11 px-space-md bg-surface font-body-md text-body-md text-on-surface rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container transition-all" required minlength="8" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
        </div>
        <div>
          <label for="password2" class="block font-label-sm text-label-sm uppercase text-on-surface mb-1">Repite la contraseña</label>
          <input id="password2" class="w-full h-11 px-space-md bg-surface font-body-md text-body-md text-on-surface rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container transition-all" required minlength="8" type="password" autocomplete="new-password">
        </div>
        <button class="w-full h-12 bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md uppercase rounded-lg shadow-sm transition-all hover:shadow-md flex items-center justify-center gap-space-xs font-bold disabled:opacity-50" type="submit">
          <span>Restablecer y entrar</span>
          <span class="material-symbols-outlined text-[18px]">lock_reset</span>
        </button>
        <button type="button" id="resend" class="w-full font-label-sm text-label-sm uppercase text-primary hover:underline">Reenviar código</button>
      </form>

      <div class="hidden mt-space-sm p-space-sm rounded-lg text-center font-mono-data text-xs font-bold" id="msg" role="alert"></div>
      <div class="text-center mt-space-lg font-body-sm text-body-sm text-secondary">
        <a class="text-primary font-bold hover:underline" href="/login.html">Volver a iniciar sesión</a>
      </div>
    </div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  function showMsg(text, ok) {
    const m = $('msg');
    m.textContent = text;
    m.className = 'mt-space-sm p-space-sm rounded-lg text-center font-mono-data text-xs font-bold ' +
      (ok ? 'bg-green-700/10 text-green-800' : 'bg-primary/10 text-primary');
  }
  async function post(url, body) {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Error');
    return data;
  }

  async function requestCode(btn) {
    btn.disabled = true;
    try {
      await post('/api/password/forgot', { identifier: $('identifier').value.trim() });
      $('step1').classList.add('hidden');
      $('step2').classList.remove('hidden');
      $('intro').textContent = 'Si la cuenta existe y tiene correo registrado, te enviamos un código. Revisa también la carpeta de spam.';
      showMsg('Código enviado. Vence en 15 minutos.', true);
      $('code').focus();
    } catch (e) { showMsg(e.message, false); }
    btn.disabled = false;
  }

  $('step1').addEventListener('submit', (e) => { e.preventDefault(); requestCode(e.submitter || $('step1').querySelector('button')); });
  $('resend').addEventListener('click', (e) => requestCode(e.currentTarget));

  $('code').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });

  $('step2').addEventListener('submit', async (e) => {
    e.preventDefault();
    if ($('password').value !== $('password2').value) return showMsg('Las contraseñas no coinciden', false);
    const btn = $('step2').querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      await post('/api/password/reset', {
        identifier: $('identifier').value.trim(),
        code: $('code').value.trim(),
        password: $('password').value
      });
      showMsg('Contraseña actualizada. Entrando…', true);
      setTimeout(() => location.replace('/'), 800);
      return;
    } catch (ex) { showMsg(ex.message, false); }
    btn.disabled = false;
  });
</script>
</body>
</html>
